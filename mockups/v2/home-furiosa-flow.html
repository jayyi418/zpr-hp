<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZEPHYROS — v2</title>
<script>
  // Language: ?lang=en | ?lang=ko (mirrors the real site's /en/ routes); remembered per viewer.
  (function () {
    var q = new URLSearchParams(location.search).get('lang'), s = null;
    try { s = localStorage.getItem('zpr-lang'); } catch (e) {}
    var lang = (q === 'en' || q === 'ko') ? q : (s === 'en' ? 'en' : 'ko');
    try { localStorage.setItem('zpr-lang', lang); } catch (e) {}
    document.documentElement.lang = lang;
    document.documentElement.classList.add('js');
  })();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap">
<style>
/* =========================================================
   Tokens — brand colors (logo + IR deck); type & layout measured
   on furiosa.ai (flow, dark chapters) and diode.computer (paper)
   ========================================================= */
:root {
  --abyss: #030A1F; --navy: #0A1A5A; --royal: #0048C8; --royal-hi: #1A5CDB; --sky: #3A88E8;
  --cerulean: #0A6AAA; --steel: #62A2D2;
  --paper: #F2F4F7; --ink: #0B1433; --line: #D3DAE4; --muted-l: #4F5A73;
  --on-dark: #EEF2FA; --muted-d: #8F9BB8; --hair-d: rgba(98,162,210,.2);
  --sans: 'Wanted Sans Variable', 'Wanted Sans', -apple-system, system-ui, sans-serif;
  --mono: 'Geist Mono', 'Wanted Sans Variable', ui-monospace, monospace;
  /* Korean labels read badly in a monospace (wide word gaps) — KO uses the sans for UI labels, EN keeps Furiosa's mono */
  --ui: var(--sans);
}
html[lang="en"] { --ui: var(--mono); }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 400 16px/1.65 var(--sans); color: var(--on-dark); background: var(--abyss); word-break: keep-all; overflow-wrap: break-word; -webkit-font-smoothing: antialiased; }
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, h4, p, figure { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button { font: inherit; color: inherit; }
.container { width: min(100% - 172.8px, 1248px); margin-inline: auto; }
@media (max-width: 767px) { .container { width: calc(100% - 40px); } }
.dark { background: var(--abyss); color: var(--on-dark); --muted: var(--muted-d); --hair: var(--hair-d); --accent: var(--sky); }
.paper { background: var(--paper); color: var(--ink); --muted: var(--muted-l); --hair: var(--ink); --accent: var(--royal); }
.sec { padding: 144px 0; }
@media (max-width: 767px) { .sec { padding: 96px 0; } }

/* type — Furiosa: display 84/72 · h 48/36/28 · lead 24 · body 16 · mono 14 */
.t-display { font-weight: 400; font-size: 84px; line-height: 1.02; text-transform: uppercase; letter-spacing: -0.015em; }
.t-h1 { font-weight: 500; font-size: 64px; line-height: 1.18; letter-spacing: -0.02em; }
.t-h2 { font-weight: 500; font-size: 48px; line-height: 1.2; letter-spacing: -0.02em; }
.t-h3 { font-weight: 400; font-size: 36px; line-height: 1.3; letter-spacing: -0.015em; }
.t-lead { font-weight: 400; font-size: 24px; line-height: 1.5; }
.t-18 { font-size: 18px; line-height: 1.6; }
.t-label { font: 400 14px/1.5 var(--mono); letter-spacing: .02em; }
.muted { color: var(--muted); }
html[lang="en"] .t-h1 { font-size: 60px; }
@media (max-width: 767px) {
  .t-display { font-size: 40px; } .t-h1, html[lang="en"] .t-h1 { font-size: 36px; } .t-h2 { font-size: 30px; } .t-h3 { font-size: 24px; } .t-lead { font-size: 18px; } .t-18 { font-size: 16px; }
}
.brand { white-space: nowrap; } .brand i { display: inline-block; width: .42em; }

/* chapter head — identical in dark and paper sections, always left-aligned */
.chead { display: grid; grid-template-columns: repeat(12, 1fr); column-gap: 48px; padding-top: 24px; border-top: 1px solid var(--hair); margin-bottom: 72px; }
.chead .t-label { grid-column: 1 / -1; color: var(--muted); margin-bottom: 40px; display: flex; justify-content: space-between; }
.chead .t-display { grid-column: 1 / 11; }
.chead .t-lead { grid-column: 1 / 8; margin-top: 32px; color: var(--muted); }
@media (max-width: 767px) { .chead { display: block; margin-bottom: 48px; } .chead .t-label { margin-bottom: 24px; } .chead .t-lead { margin-top: 20px; } }

/* buttons — Furiosa: 16px, 14/24 padding, r6, gap 8, 16px arrow-up-right; ghost = text only */
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 50px; padding: 14px 24px; border-radius: 6px; border: 1px solid transparent; font: 500 16px/1.25 var(--ui); white-space: nowrap; transition: background .2s, color .2s, border-color .2s; }
html[lang="en"] .btn { font-weight: 400; }
.btn svg { width: 16px; height: 16px; flex: none; transition: transform .2s; }
.btn:hover svg { transform: translate(2px, -2px); }
.btn-primary { background: var(--royal); color: #fff; }
.btn-primary:hover { background: var(--royal-hi); }
.btn-ghost { background: transparent; color: inherit; padding-left: 12px; padding-right: 12px; }
.btn-ghost:hover { color: var(--accent); }
.btn-white { background: #fff; color: var(--ink); }
.btn-ink { background: var(--ink); color: #fff; }
.ctas { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.chip { display: inline-flex; align-items: center; min-height: 50px; padding: 14px 24px; border-radius: 6px; font: 500 14px/1.2 var(--ui); background: #fff; color: var(--ink); white-space: nowrap; cursor: pointer; border: 0; transition: background .2s, color .2s; }
html[lang="en"] .chip { font-weight: 400; }
.chip[aria-pressed="true"], .chip:hover { background: var(--royal); color: #fff; }
.tagHW, .tagSW { display: inline-block; font: 500 11px/1 var(--mono); letter-spacing: .06em; padding: 4px 6px; border-radius: 3px; vertical-align: middle; }
.tagHW { background: var(--royal); color: #fff; }
.tagSW { box-shadow: inset 0 0 0 1px currentColor; }

/* generated-image slot: shows the image when present, a labelled line-art placeholder otherwise */
.gslot { position: relative; overflow: hidden; }
.gslot > img { width: 100%; height: 100%; object-fit: cover; }
.gslot .ph { position: absolute; inset: 0; display: grid; place-items: center; }
.gslot .ph svg { width: 70%; max-width: 420px; opacity: .8; }
.gslot .ph span { position: absolute; left: 14px; bottom: 12px; font: 400 12px var(--mono); padding: 4px 8px; border: 1px dashed currentColor; opacity: .7; }
.gslot.has-img .ph { display: none; }

/* =========================================================
   Header (Furiosa: transparent, not sticky)
   ========================================================= */
.hdr { position: absolute; inset: 0 0 auto 0; z-index: 20; padding: 12px 0; }
.hdr .container { display: flex; align-items: center; gap: 40px; min-height: 42px; }
.logo { display: flex; align-items: center; gap: 9px; margin-right: auto; font-weight: 700; font-size: 17px; letter-spacing: .01em; color: #fff; }
.logo .mark { display: block; height: 24px; width: calc(24px * .85); overflow: hidden; flex: none; }
.logo .mark img { height: 100%; width: auto; max-width: none; }
.hdr nav ul { display: flex; gap: 32px; font-size: 16px; font-weight: 500; }
.hdr nav a:hover { color: var(--sky); }
.hdr .tools { display: flex; align-items: center; gap: 20px; }
.lang { display: flex; gap: 2px; font: 400 13px var(--mono); }
.lang a { padding: 4px 6px; color: var(--muted-d); border-radius: 4px; }
.lang a[aria-current="true"] { color: #fff; background: rgba(255,255,255,.1); }
.hdr .btn { min-height: 42px; padding: 10px 20px; font-family: var(--sans); font-weight: 500; }
@media (max-width: 959px) { .hdr nav { display: none; } .hdr .container { gap: 12px; } .hdr .btn { padding: 10px 14px; } }

/* =========================================================
   00 Hero — full-bleed media, copy bottom-left (Furiosa)
   ========================================================= */
.hero { position: relative; min-height: 100vh; min-height: 100svh; display: flex; align-items: flex-end; isolation: isolate; overflow: hidden; padding: 144px 0 96px; }
.hero .media { position: absolute; inset: 0; z-index: -2; background: radial-gradient(60% 70% at 72% 38%, #10286E 0%, #06113A 45%, var(--abyss) 100%); }
.hero .media img { width: 100%; height: 100%; object-fit: cover; }
.hero .media::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(3,10,31,.92) 0%, rgba(3,10,31,.35) 45%, rgba(3,10,31,.15) 100%); }
.hero .circuit { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
.hero .t-label { color: var(--sky); margin-bottom: 24px; }
.hero .t-h1 { max-width: 900px; }
.hero .t-h1 span { white-space: nowrap; }
.hero .t-lead { max-width: 640px; margin: 28px 0 40px; color: #C5CEE2; }
@media (max-width: 767px) { .hero .t-h1 span { white-space: normal; } }

/* =========================================================
   01 Core — media left, copy right with numbered points (Furiosa #1)
   ========================================================= */
.core-grid { display: grid; grid-template-columns: repeat(12, 1fr); column-gap: 48px; align-items: start; }
.core-media { grid-column: 1 / 6; position: sticky; top: 48px; }
.core-copy { grid-column: 6 / 13; }
.core-copy .t-label { color: var(--muted); margin-bottom: 32px; }
.core-copy .t-lead { color: var(--muted); margin: 32px 0 56px; }
.points li { display: grid; grid-template-columns: 72px 1fr; padding: 28px 0; border-top: 1px solid var(--hair); }
.points li:last-child { border-bottom: 1px solid var(--hair); }
.points .n { font: 400 28px/1.1 var(--mono); color: var(--sky); }
.points h3 { font-weight: 500; font-size: 24px; line-height: 1.35; }
.points p { margin-top: 6px; color: var(--muted); }
.xray { position: relative; --x: 60%; --y: 50%; --r: 20%; cursor: crosshair; touch-action: none; overflow: hidden; }
.xray svg { display: block; width: 100%; height: auto; }
.xray .in { position: absolute; inset: 0; clip-path: circle(var(--r) at var(--x) var(--y)); }
.xray .ring { position: absolute; left: var(--x); top: var(--y); width: calc(var(--r) * 2 * .78); aspect-ratio: 1; transform: translate(-50%, -50%); border: 1px solid var(--steel); border-radius: 50%; pointer-events: none; }
.core-media figcaption { display: flex; justify-content: space-between; gap: 12px; margin-top: 14px; color: var(--muted); }
@media (max-width: 959px) { .core-media, .core-copy { grid-column: 1 / -1; } .core-media { position: static; margin-bottom: 48px; } }

/* =========================================================
   02 Highlights — tag filter + card rail (Furiosa news)
   ========================================================= */
.hl-bar { display: flex; justify-content: space-between; align-items: center; gap: 24px; margin-bottom: 32px; flex-wrap: wrap; }
.hl-bar .chips { display: flex; gap: 8px; flex-wrap: wrap; }
.hl-nav { display: flex; gap: 8px; }
.hl-nav button { width: 50px; height: 50px; border-radius: 6px; border: 1px solid var(--hair-d); background: transparent; cursor: pointer; display: grid; place-items: center; }
.hl-nav button:hover { border-color: var(--sky); }
.hl-nav svg { width: 18px; height: 18px; }
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: min(420px, 82vw); gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 4px; }
.rail::-webkit-scrollbar { display: none; }
.card { scroll-snap-align: start; background: #fff; color: var(--ink); border-radius: 6px; padding: 24px; min-height: 280px; display: flex; flex-direction: column; }
.card .meta { display: flex; justify-content: space-between; font: 400 13px var(--mono); color: var(--muted-l); }
.card .meta b { font-weight: 500; color: var(--royal); }
.card h3 { font-weight: 400; font-size: 26px; line-height: 1.35; letter-spacing: -0.01em; margin-top: 24px; }
.card .arr { margin-top: auto; align-self: flex-end; width: 20px; height: 20px; color: var(--muted-l); }
.card[hidden] { display: none; }

/* =========================================================
   03 HW×SW — centered interlude (Furiosa "Tensor contraction, not matmul")
   ========================================================= */
.interlude { text-align: center; }
.interlude .head { width: min(100%, 816px); margin: 0 auto; }
.interlude .t-label { color: var(--muted); }
.interlude .t-h2 { margin: 24px 0; }
.interlude .t-18 { color: var(--muted); }
.engine { --l1-face: rgba(22,38,78,.94); --l1-side: #0B1530; --l1-stroke: #62A2D2; --l2-face: rgba(10,26,90,.7); --l2-side: #081454; --l2-stroke: #3A88E8; --l3-face: #0048C8; --l3-side: #00308A; --l3-stroke: #62A2D2; --trace: #62A2D2; --comp-top: #1B2744; --comp-side: #0A1022; --comp-side2: #121B33; --comp-edge: #9CC3FF; --fg: #EEF2FA; }
.engine svg { width: min(100%, 760px); height: auto; margin: 56px auto 0; display: block; overflow: visible; }
.esteps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin-top: 40px; text-align: left; border-top: 1px solid var(--hair-d); }
.esteps li { padding: 24px 24px 0 0; opacity: .38; transition: opacity .4s; }
.esteps li + li { padding-left: 24px; border-left: 1px solid var(--hair-d); }
.esteps li.on { opacity: 1; }
.esteps .n { font: 400 14px var(--mono); color: var(--sky); }
.esteps h3 { font-weight: 500; font-size: 20px; margin: 8px 0 6px; display: flex; gap: 8px; align-items: center; }
.esteps p { color: var(--muted-d); font-size: 15px; }
.interlude .ctas { justify-content: center; margin-top: 48px; }
@media (max-width: 767px) { .esteps { grid-template-columns: 1fr; } .esteps li + li { padding-left: 0; border-left: 0; border-top: 1px solid var(--hair-d); margin-top: 20px; } .esteps li { opacity: 1; } }

/* =========================================================
   04–05 Hardware / Software (paper, Diode)
   ========================================================= */
.split { display: grid; grid-template-columns: repeat(12, 1fr); column-gap: 48px; align-items: stretch; margin-bottom: 96px; }
.split > .l { grid-column: 1 / 8; } .split > .r { grid-column: 8 / 13; display: flex; flex-direction: column; }
.split .r .t-h3 { margin-bottom: 16px; }
.split .r p { color: var(--muted-l); }
@media (max-width: 959px) { .split > .l, .split > .r { grid-column: 1 / -1; } .split > .r { margin-top: 32px; } }
.frame { border: 1px solid var(--ink); background: #fff; }
.specgrid { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--ink); margin-top: auto; }
.specgrid > div { padding: 20px 0 0; }
.specgrid .v { font: 400 28px/1.2 var(--mono); letter-spacing: -0.02em; }
.specgrid .k { margin-top: 4px; color: var(--muted-l); }
.cap { margin-top: 12px; color: var(--muted-l); }

.compare { --pos: 50%; position: relative; width: 100%; aspect-ratio: 5 / 3; overflow: hidden; background: #EEF1F6; user-select: none; }
.compare svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.compare .after { clip-path: inset(0 0 0 var(--pos)); }
.compare .handle { position: absolute; top: 0; bottom: 0; left: var(--pos); width: 2px; margin-left: -1px; background: #fff; pointer-events: none; }
.compare .knob { position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; background: #fff; border: 1px solid var(--ink); display: grid; place-items: center; font: 400 13px var(--mono); color: var(--ink); }
.compare input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; }
.compare:has(input:focus-visible) .knob { outline: 3px solid var(--royal); outline-offset: 2px; }
.compare .cl, .compare .cr { position: absolute; top: 12px; font: 400 12px var(--mono); padding: 5px 8px; pointer-events: none; }
.compare .cl { left: 12px; background: #fff; border: 1px solid var(--ink); color: var(--ink); }
.compare .cr { right: 12px; background: var(--ink); color: #fff; }

.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
.tab { font: 500 16px/1 var(--ui); padding: 12px 16px; border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; display: inline-flex; gap: 10px; align-items: center; }
html[lang="en"] .tab { font-weight: 400; }
.tab .i { font-family: var(--mono); font-weight: 400; }
.tab[aria-selected="true"] { background: var(--ink); color: #fff; }
.panel-top { display: grid; grid-template-columns: 7fr 5fr; }
.fig { border-right: 1px solid var(--ink); padding: 24px; display: flex; flex-direction: column; }
.fig .gslot { flex: 1; min-height: 380px; aspect-ratio: 4 / 3; background: var(--paper); color: var(--ink); }
.fig .cap { margin-top: 14px; }
.body { padding: 32px; display: flex; flex-direction: column; }
.body .no { color: var(--royal); display: flex; gap: 10px; align-items: center; }
.body .t-h3 { margin: 12px 0 16px; }
.body p { color: var(--muted-l); }
.pap { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--ink); }
.pap > div { padding: 20px 24px; }
.pap > div + div { border-left: 1px solid var(--ink); }
.pap b { display: block; font: 500 12px var(--mono); letter-spacing: .08em; margin-bottom: 8px; }
.pap p { font-size: 15.5px; line-height: 1.55; }
@media (max-width: 959px) { .panel-top { grid-template-columns: 1fr; } .fig { border-right: 0; border-bottom: 1px solid var(--ink); } .pap { grid-template-columns: 1fr 1fr; } .pap > div:nth-child(3) { border-left: 0; } .pap > div:nth-child(n+3) { border-top: 1px solid var(--ink); } .fig .gslot { min-height: 0; } }

/* SW stack (Furiosa software-stack diagram, drawn on paper) */
.stack { padding: 32px; }
.stack ol { position: relative; }
.stack li { position: relative; display: grid; grid-template-columns: 56px 1fr; align-items: center; min-height: 64px; }
.stack li + li { margin-top: 16px; }
.stack .node { width: 56px; height: 56px; border: 1px solid var(--ink); display: grid; place-items: center; font: 400 13px var(--mono); background: #fff; position: relative; z-index: 1; }
.stack li.hl .node { background: var(--royal); border-color: var(--royal); color: #fff; }
.stack .txt { padding-left: 24px; }
.stack .txt b { display: block; font-weight: 500; font-size: 18px; }
.stack .txt span { color: var(--muted-l); font-size: 14.5px; }
.stack ol::before { content: ''; position: absolute; left: 27.5px; top: 28px; bottom: 28px; border-left: 1px solid var(--ink); }
.stack .loop { margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--line); color: var(--royal); }

.onespin .row { display: grid; grid-template-columns: 180px 1fr; border-top: 1px solid var(--ink); }
.onespin .row:first-child { border-top: 0; }
.onespin .k { padding: 20px 24px; border-right: 1px solid var(--ink); }
.onespin .k b { display: block; font: 500 12px var(--mono); letter-spacing: .08em; margin-bottom: 4px; }
.onespin .bars { padding: 16px 24px; display: grid; gap: 10px; }
.bar { display: grid; grid-template-columns: 110px minmax(0, 1fr); align-items: center; gap: 16px; }
.bar .who { font: 400 13px var(--mono); color: var(--muted-l); }
.bar .track { position: relative; height: 30px; }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: var(--w); transform-origin: left; transform: scaleX(var(--s, 0)); transition: transform 1.2s cubic-bezier(.2,.7,.2,1); }
.bar.old .fill { background: repeating-linear-gradient(135deg, #C9D1DE 0 6px, #DCE2EB 6px 12px); }
.bar.new .fill { background: var(--royal); }
.bar .val { position: absolute; left: calc(var(--w) + 12px); top: 50%; transform: translateY(-50%); font: 400 15px var(--mono); white-space: nowrap; }
.bar.new .val { color: var(--royal); }
.onespin.in .fill { --s: 1; }
@media (max-width: 767px) { .onespin .row { grid-template-columns: 1fr; } .onespin .k { border-right: 0; border-bottom: 1px solid var(--ink); } .bar { grid-template-columns: 76px minmax(0, 1fr); } .bar .track { height: 20px; margin-top: 20px; } .bar .val { left: auto; right: 0; top: -4px; transform: translateY(-100%); font-size: 13px; } }
.subhead { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin: 0 0 24px; flex-wrap: wrap; }
.subhead .t-h3 { max-width: 640px; }

/* =========================================================
   06 Platforms (dark)
   ========================================================= */
.plat-hero { aspect-ratio: 21 / 9; border-radius: 6px; border: 1px solid var(--hair-d); background: radial-gradient(70% 90% at 50% 60%, #0E2468 0%, #030A1F 75%); color: var(--steel); margin-bottom: 24px; }
.status { display: inline-flex; gap: 10px; align-items: center; color: var(--muted-d); }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--sky); box-shadow: 0 0 0 4px rgba(58,136,232,.2); }
.lines { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.line { border: 1px solid var(--hair-d); border-radius: 6px; overflow: hidden; background: rgba(10,26,90,.18); transition: border-color .3s, background .3s; }
.line.hl { border-color: var(--sky); background: rgba(10,26,90,.45); }
.line .gslot { aspect-ratio: 4 / 3; border-bottom: 1px solid var(--hair-d); background: radial-gradient(70% 70% at 50% 45%, #0E2468 0%, #030A1F 75%); color: var(--steel); }
.line .L { position: absolute; left: 20px; top: 14px; z-index: 2; font: 400 64px/1 var(--mono); color: #fff; }
.line .txt { padding: 24px; }
.line .name { font: 400 14px var(--mono); color: var(--sky); }
.line h3 { font-weight: 500; font-size: 22px; margin: 8px 0 16px; }
.gens li { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--hair-d); font-size: 15px; }

    $$('.tab', list).forEach(b => { const on = +b.dataset.t === k; b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1; });
    panel.innerHTML = `<div class="panel-top"><div class="fig">${gslot(x.gen, x.gid, '', t(x.title))}<p class="cap t-label">FIG.${x.i} — ${t(x.title)}</p></div>
      <div class="body"><p class="no t-label">${x.i} / 05 · <span class="tag${x.kind}">${x.kind}</span></p><h3 class="t-h3">${t(x.title)}</h3><p class="t-18">${t(x.lead)}</p>
      <div class="specgrid">${x.specs.map(([v, l]) => `<div><div class="v">${t(v)}</div><div class="k t-label">${t(l)}</div></div>`).join('')}</div></div></div>
      <div class="pap">${C.papHead.map((h, n) => `<div><b>${h}</b><p>${t(x.pap[n])}</p></div>`).join('')}</div>`;
  };
  list.addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) show(+b.dataset.t); });
  list.addEventListener('keydown', e => { if (!['ArrowLeft', 'ArrowRight'].includes(e.key)) return; const cur = ids.findIndex(k => $(`.tab[data-t="${k}"]`, list).getAttribute('aria-selected') === 'true'); const nx = ids[(cur + (e.key === 'ArrowRight' ? 1 : ids.length - 1)) % ids.length]; show(nx); $(`.tab[data-t="${nx}"]`, list).focus(); });
  show(ids[0]);
});

/* highlights filter + rail arrows */
(() => {
  const chips = $$('#highlights .chip'), cards = $$('#highlights .card'), rail = $('#highlights .rail');
  chips.forEach(c => c.addEventListener('click', () => { chips.forEach(x => x.setAttribute('aria-pressed', x === c)); cards.forEach(k => k.hidden = !(c.dataset.f === 'all' || k.dataset.k === c.dataset.f)); rail.scrollTo({ left: 0, behavior: 'smooth' }); }));
  $$('#highlights .hl-nav button').forEach(b => b.addEventListener('click', () => rail.scrollBy({ left: +b.dataset.d * (Math.min(420, innerWidth * .82) + 16), behavior: 'smooth' })));
})();

/* roadmap highlight */
(() => {
  const lines = $$('.line'), rows = $$('.tl-row[data-line]'), yrs = $$('.tl-row.hd [data-y]'), map = { 2026: ['Z'], 2027: ['P'], 2028: ['Z', 'R'], 2029: ['P', 'R'] };
  const hl = arr => lines.forEach(l => l.classList.toggle('hl', !!arr && arr.includes(l.dataset.line)));
  [...lines, ...rows].forEach(el => { el.addEventListener('mouseenter', () => hl([el.dataset.line])); el.addEventListener('mouseleave', () => hl(null)); });
  yrs.forEach(y => { y.addEventListener('mouseenter', () => { y.classList.add('on'); hl(map[y.dataset.y]); }); y.addEventListener('mouseleave', () => { y.classList.remove('on'); hl(null); }); });
})();

/* HW×SW layer explode — scrubbed through the centered interlude (no pin) */
(() => {
  const HWd = 200, HHd = 100, TH = 12, CX = 340;
  const iso = (u, v) => [(u - v) * HWd / 2, (u + v) * HHd / 2], P = pts => pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' '), up = (p, h) => [p[0], p[1] - h];
  const box = (u0, v0, u1, v1, h) => { const a = iso(u0, v0), b = iso(u1, v0), c = iso(u1, v1), d = iso(u0, v1); return { top: [up(a, h), up(b, h), up(c, h), up(d, h)], right: [up(b, h), up(c, h), c, b], left: [up(d, h), up(c, h), c, d], base: [a, b, c, d] }; };
  const COMPS = [[.66,-.3,'u'],[.8,-.08,'v'],[.72,.3,'u'],[.62,.78,'v'],[.3,.64,'u'],[-.3,.72,'u'],[-.12,.66,'v'],[-.74,.2,'v'],[-.8,-.22,'u'],[-.3,-.7,'v'],[-.62,-.72,'u'],[.26,-.66,'u'],[.62,-.78,'v'],[.86,.56,'u']];
  const ROUTES = [[[.22,-.12],[.5,-.12],[.5,-.52],[.92,-.52]],[[.22,0],[.92,0]],[[.22,.12],[.44,.12],[.44,.44],[.92,.44]],[[-.12,.22],[-.12,.5],[-.48,.5],[-.48,.92]],[[0,.22],[0,.92]],[[.12,.22],[.12,.4],[.2,.4],[.2,.92]],[[-.22,-.12],[-.56,-.12],[-.56,-.46],[-.92,-.46]],[[-.22,0],[-.92,0]],[[-.22,.12],[-.4,.12],[-.4,.38],[-.92,.38]],[[-.12,-.22],[-.12,-.52],[-.4,-.52],[-.4,-.92]],[[0,-.22],[0,-.92]],[[.12,-.22],[.12,-.4],[.42,-.4],[.42,-.92]]];
  const layer = (n, label) => { const a = iso(-1,-1), r = iso(1,-1), b = iso(1,1), l = iso(-1,1), side = [l, b, r, [r[0], r[1] + TH], [b[0], b[1] + TH], [l[0], l[1] + TH]]; let g = ''; for (const k of [-.5, 0, .5]) g += `<line x1="${iso(k,-1)[0]}" y1="${iso(k,-1)[1]}" x2="${iso(k,1)[0]}" y2="${iso(k,1)[1]}"/><line x1="${iso(-1,k)[0]}" y1="${iso(-1,k)[1]}" x2="${iso(1,k)[0]}" y2="${iso(1,k)[1]}"/>`;
    return `<g id="L${n}"><polygon points="${P(side)}" style="fill:var(--l${n}-side)"/><polygon points="${P([a, r, b, l])}" style="fill:var(--l${n}-face);stroke:var(--l${n}-stroke)"/><g style="stroke:var(--l${n}-stroke)" stroke-width=".7" opacity=".16">${g}</g><g class="inner"></g><g class="lbl" opacity="0"><line x1="${HWd + 8}" y1="0" x2="${HWd + 28}" y2="0" stroke="#8F9BB8"/><text x="${HWd + 34}" y="4" font-family="Geist Mono, monospace" font-size="12" fill="#EEF2FA">${label}</text></g></g>`; };
  const comp = ([u, v, o], h) => { const du = o === 'u' ? .07 : .03, dv = o === 'u' ? .03 : .07, b = box(u - du, v - dv, u + du, v + dv, h); return `<g><polygon points="${P(b.right)}" style="fill:var(--comp-side)"/><polygon points="${P(b.left)}" style="fill:var(--comp-side2)"/><polygon points="${P(b.top)}" style="fill:var(--comp-top);stroke:var(--comp-edge)" stroke-width=".7"/></g>`; };
  const svg = $('#pcb'), steps = $$('.esteps li');
  svg.innerHTML = `<defs><linearGradient id="chipTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22325A"/><stop offset="1" stop-color="#0A1022"/></linearGradient><linearGradient id="dieG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8AB8FF"/><stop offset=".55" stop-color="#0048C8"/><stop offset="1" stop-color="#0A1A5A"/></linearGradient><radialGradient id="heatG"><stop offset="0" stop-color="#3A88E8" stop-opacity=".8"/><stop offset=".45" stop-color="#62A2D2" stop-opacity=".35"/><stop offset="1" stop-color="#62A2D2" stop-opacity="0"/></radialGradient><clipPath id="l1clip"><polygon points="${P([iso(-1,-1), iso(1,-1), iso(1,1), iso(-1,1)])}"/></clipPath></defs>${layer(3, 'L3 · Power')}${layer(2, 'L2 · Embedded L/C')}${layer(1, 'L1 · AI SoC')}<g id="comps">${COMPS.map(c => comp(c, 6)).join('')}</g>`;
  let hatch = ''; for (let k = -.8; k <= .81; k += .2) hatch += `<line x1="${iso(k,-.92)[0]}" y1="${iso(k,-.92)[1]}" x2="${iso(k,.92)[0]}" y2="${iso(k,.92)[1]}"/>`;
  $('#L3 .inner').innerHTML = `<g style="stroke:var(--l3-stroke)" opacity=".35">${hatch}</g>`;
  $('#L2 .inner').innerHTML = COMPS.map(([u, v, o]) => { const du = o === 'u' ? .07 : .03, dv = o === 'u' ? .03 : .07; return `<polygon class="ghost" opacity="0" points="${P(box(u - du, v - dv, u + du, v + dv, 0).base)}" fill="none" stroke="#3A88E8" stroke-dasharray="3 2"/>`; }).join('');
  const k = .707, chip = box(-.22, -.22, .22, .22, 12), die = box(-.12, -.12, .12, .12, 12);
  $('#L1 .inner').innerHTML = ROUTES.map(r => `<path class="trace" d="M${r.map(p => iso(p[0], p[1]).map(n => n.toFixed(1)).join(' ')).join(' L')}" style="stroke:var(--trace)" fill="none" stroke-width="1.5"/>`).join('')
    + ROUTES.map(r => { const e = iso(...r[r.length - 1]); return `<ellipse class="pad" opacity="0" cx="${e[0]}" cy="${e[1]}" rx="4" ry="2" style="fill:var(--trace)"/>`; }).join('')
    + `<g clip-path="url(#l1clip)"><ellipse id="heat" opacity="0" cx="0" cy="0" rx="${HWd * .8}" ry="${HHd * .8}" fill="url(#heatG)"/></g>`
    + [.3, .52, .74].map(r => `<ellipse class="contour" opacity="0" cx="0" cy="0" rx="${r * HWd * k}" ry="${r * HHd * k}" fill="none" stroke="#3A88E8" stroke-dasharray="4 3"/>`).join('')
    + `<polygon points="${P(chip.right)}" fill="#070C18"/><polygon points="${P(chip.left)}" fill="#0C1428"/><polygon points="${P(chip.top)}" fill="url(#chipTop)" style="stroke:var(--l1-stroke)"/><polygon points="${P(die.top)}" fill="url(#dieG)" stroke="#CFE2FF" stroke-opacity=".6" stroke-width=".8"/>`
    + `<g id="badge98" opacity="0" transform="translate(${-HWd + 4} ${-HHd - 44})"><rect width="190" height="50" rx="6" fill="#0A1A5A" stroke="#3A88E8"/><text x="14" y="19" font-family="Geist Mono, monospace" font-size="9.5" letter-spacing="1" fill="#8F9BB8">MEASURED ≈ SIMULATED</text><text x="14" y="41" font-family="Geist Mono, monospace" font-size="20" fill="#EEF2FA">98%</text><text x="66" y="40" font-family="Geist Mono, monospace" font-size="11" fill="#8F9BB8">S-Parameter</text></g>`;
  const L1 = $('#L1'), L2 = $('#L2'), L3 = $('#L3'), comps = $('#comps'), traces = $$('#pcb .trace');
  traces.forEach(p => { const l = p.getTotalLength(); p.style.strokeDasharray = l; p.style.strokeDashoffset = l; });
  const sync = tl => { const tt = tl.time(); steps.forEach((s, i) => s.classList.toggle('on', i === (tt < 1.05 ? 0 : tt < 2.05 ? 1 : 2))); if (tt < 1.5) { if (comps.previousElementSibling !== L1) L1.after(comps); } else if (comps.nextElementSibling !== L1) L1.before(comps); };
  if (!window.gsap) return;
  gsap.registerPlugin(ScrollTrigger);
  gsap.set(L1, { x: CX, y: 280 }); gsap.set(L2, { x: CX, y: 296 }); gsap.set(L3, { x: CX, y: 312 }); gsap.set(comps, { x: CX, y: 280 }); gsap.set('#badge98', { y: -HHd - 36 });
  const tl = gsap.timeline({ defaults: { ease: 'none' }, paused: true }); tl.eventCallback('onUpdate', () => sync(tl));
  tl.to(traces, { strokeDashoffset: 0, duration: .7, stagger: .025 }, .05).to('#pcb .pad', { opacity: 1, duration: .15, stagger: .02 }, .55)
    .to(L1, { y: 150, duration: .8, ease: 'power2.inOut' }, 1.1).to(L2, { y: 300, duration: .8, ease: 'power2.inOut' }, 1.1).to(L3, { y: 450, duration: .8, ease: 'power2.inOut' }, 1.1)
    .to('#pcb .ghost', { opacity: 1, duration: .2 }, 1.2).to(comps, { y: 300, duration: .7, ease: 'power2.inOut' }, 1.25).to('#pcb .ghost', { opacity: 0, duration: .2 }, 1.85).to('#pcb .lbl', { opacity: 1, duration: .25, stagger: .06 }, 1.7)
    .to('#heat', { opacity: 1, duration: .45 }, 2.1).fromTo('#pcb .contour', { opacity: 0, scale: .6, transformOrigin: '50% 50%' }, { opacity: .8, scale: 1, duration: .45, stagger: .08 }, 2.2).to('#badge98', { opacity: 1, y: -HHd - 44, duration: .3 }, 2.55);
  if (reduced) { tl.progress(1); steps.forEach(s => s.classList.add('on')); return; }
  ScrollTrigger.create({ trigger: svg, start: 'top 85%', end: 'bottom 35%', scrub: .6, animation: tl });
  addEventListener('load', () => ScrollTrigger.refresh());
})();

/* reveal, count-up, One-Spin bars */
const io = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) return; e.target.classList.add('in'); io.unobserve(e.target); }), { rootMargin: '0px 0px -8% 0px' });
$$('.rv, .onespin').forEach(el => io.observe(el));
const cio = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) return; cio.unobserve(e.target); const el = e.target, to = +el.dataset.count, t0 = performance.now(); const f = n => { const p = Math.min(1, (n - t0) / 1200); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(f); }; requestAnimationFrame(f); }), { threshold: .6 });
if (!reduced) $$('[data-count]').forEach(el => { el.textContent = '0'; cio.observe(el); });
})();
</script>
