<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영문 헤드라인 후보</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap">
<style>
  :root { --abyss: #030A1F; --royal: #0048C8; --sky: #3A88E8; --steel: #62A2D2; --muted: #8F9BB8; --ink: #0B1433; --line: #D3DAE4;
          --sans: 'Wanted Sans Variable', system-ui, sans-serif; --mono: 'Geist Mono', 'Wanted Sans Variable', monospace; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #E9ECF1; color: var(--ink); font-family: var(--sans); word-break: keep-all; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 40px 20px 90px; }
  h1 { font-size: 26px; margin: 0 0 8px; letter-spacing: -0.02em; }
  .sub { color: #56607A; margin: 0 0 32px; line-height: 1.7; max-width: 860px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 24px; }
  .hero { container-type: inline-size; position: relative; background: radial-gradient(60% 90% at 78% 30%, #10286E 0%, #06113A 45%, var(--abyss) 100%); color: #EEF2FA; padding: 5.5cqw 4.5cqw 4.5cqw; overflow: hidden; }
  .hero::after { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(98,162,210,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(98,162,210,.06) 1px, transparent 1px); background-size: 28px 28px; pointer-events: none; }
  .hero > * { position: relative; z-index: 1; }
  .eyebrow { font: 400 1.05cqw var(--mono); letter-spacing: .02em; color: var(--sky); margin-bottom: 2cqw; }
  .h { font-weight: 500; font-size: 5.6cqw; line-height: 1.04; letter-spacing: -0.02em; text-transform: uppercase; margin: 0; }
  .ko { margin-top: 2.2cqw; font-size: 1.7cqw; line-height: 1.55; color: #C5CEE2; max-width: 60cqw; }
  .ko b { color: #fff; font-weight: 500; }
  .btns { display: flex; gap: .6cqw; margin-top: 2.6cqw; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: .6cqw; padding: 1cqw 1.8cqw; border-radius: .45cqw; font: 500 1.15cqw var(--sans); white-space: nowrap; }
  .btn svg { width: 1.15cqw; height: 1.15cqw; }
  .p { background: var(--royal); color: #fff; }
  .g { color: #EEF2FA; }
  .meta { display: grid; grid-template-columns: 90px 1fr 1fr 1fr; border-top: 1px solid var(--line); }
  .meta > div { padding: 16px 20px; font-size: 14px; line-height: 1.6; }
  .meta > div + div { border-left: 1px solid var(--line); }
  .meta .id { font: 500 22px var(--mono); display: flex; flex-direction: column; gap: 6px; }
  .meta .id span { font: 600 11px var(--mono); color: #fff; background: var(--royal); padding: 3px 7px; border-radius: 3px; width: max-content; }
  .meta b { display: block; font: 500 11px var(--mono); letter-spacing: .08em; color: #56607A; margin-bottom: 4px; }
  @media (max-width: 760px) { .meta { grid-template-columns: 1fr; } .meta > div + div { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>영문 헤드라인 후보</h1>
  <p class="sub">헤드라인은 영문 하나로 국문·영문 사이트에 공통으로 쓰고, 그 아래에 언어별 한 줄을 붙이는 구성입니다(퓨리오사·리벨리온 방식). 크기와 대문자, 버튼은 현재 시안의 히어로와 같습니다. 마음에 드는 번호를 채팅으로 알려주세요.</p>
  <div id="list"></div>
</div>
<script>
const ARROW = '<svg viewBox="0 0 256 256" fill="currentColor"><path d="M200,64V168a8,8,0,0,1-16,0V83.31L69.66,197.66a8,8,0,0,1-11.32-11.32L172.69,72H88a8,8,0,0,1,0-16H192A8,8,0,0,1,200,64Z"/></svg>';
const C = [
  { id: 'A', rec: true, h: 'Less noise.<br>More sense.',
    ko: '노이즈는 줄이고, 감각은 더합니다. <b>AI와 로보틱스를 위한 하드웨어 &amp; 소프트웨어.</b>',
    en: 'Hardware & software for AI and robotics — the sensing and noise layer of Physical AI.',
    why: 'IR 포지셔닝인 "감각·노이즈 계층"을 두 단어로 줄였습니다. EMI 필터(노이즈)와 촉각센서(감각)가 바로 연결됩니다.',
    plus: '짧고 기억에 남습니다. noise와 sense가 대구를 이루고, 다른 회사가 쓰기 어려운 문장입니다.',
    minus: '"sense"에 감각과 분별이라는 두 뜻이 겹칩니다. 말장난으로 읽힐 수 있어 서브 문장이 회사 설명을 맡아야 합니다.' },
  { id: 'B', h: 'Built in,<br>not bolted on.',
    ko: '부품을 올리지 않고, 기판 안에 넣습니다. <b>AI와 로보틱스를 위한 하드웨어 &amp; 소프트웨어.</b>',
    en: 'Components embedded inside the board — hardware & software for AI and robotics.',
    why: '핵심 기술인 기판 내장(Embedded L/C)을 영어 관용구로 표현했습니다. "bolted on"은 덧붙여 달았다는 뜻입니다.',
    plus: '가장 직관적인 기술 차별점입니다. 퓨리오사의 "Tensor contraction, not matmul"과 같은 대비 구조입니다.',
    minus: '하드웨어 한 가지만 말합니다. 소프트웨어(AI 설계)와 융합 메시지는 서브가 맡아야 하고, 01 섹션 제목과 겹칩니다.' },
  { id: 'C', h: 'Smaller. Quieter.<br>More sensitive.',
    ko: '더 작게, 더 조용하게, 더 민감하게. <b>AI와 로보틱스를 위한 하드웨어 &amp; 소프트웨어.</b>',
    en: 'Embedded, low-noise and highly sensitive — hardware & software for AI and robotics.',
    why: '하드웨어 기술 세 가지를 고객이 얻는 결과로 말합니다. 기판 내장은 작게, EMI 필터는 조용하게, 촉각센서는 민감하게에 대응합니다.',
    plus: '고객 이득이 분명하고 리듬감이 좋습니다.',
    minus: '세 단어 나열은 흔한 형식이고, 무엇을 만드는 회사인지는 서브를 봐야 압니다.' },
  { id: 'D', h: 'The sensing & noise layer<br>of Physical AI',
    ko: 'Physical AI의 감각·노이즈 계층을 설계합니다. <b>AI와 로보틱스를 위한 하드웨어 &amp; 소프트웨어.</b>',
    en: 'Hardware & software for AI and robotics, from materials to systems.',
    why: 'IR의 포지셔닝 문장을 그대로 헤드라인으로 옮겼습니다.',
    plus: '회사의 자리(카테고리)를 정확히 정의합니다. 투자자와 기관 심사에 강합니다.',
    minus: '"layer"는 업계 용어라 처음 보는 고객에게는 추상적입니다. 길이도 가장 깁니다.' },
  { id: 'E', h: 'Hardware & software<br>for Physical AI',
    ko: '<b>AI와 로보틱스를 위한 하드웨어 &amp; 소프트웨어.</b> 소자 설계와 AI 설계 자동화를 하나로 융합합니다.',
    en: 'We fuse device-level design with AI design automation.',
    why: '현재 국문 헤드라인을 영문으로 옮기되, "AI and robotics"를 IR 용어인 "Physical AI"로 묶었습니다.',
    plus: '가장 명료하고 현재 방향과 가장 가깝습니다.',
    minus: '차별점이 헤드라인에 없어서 비슷한 회사와 구별되지 않습니다.' },
  { id: 'F', h: 'Physical AI,<br>designed from the board up.',
    ko: '기판에서 시작해 시스템까지 설계합니다. <b>AI와 로보틱스를 위한 하드웨어 &amp; 소프트웨어.</b>',
    en: 'From materials and boards to systems and software.',
    why: '"소재·부품·모듈·시스템 통합 설계"라는 IR 문장을 한 줄로 줄였습니다. "from the ground up"을 비튼 표현입니다.',
    plus: '기판 기술과 시스템 역량을 함께 말하고, 신뢰감 있는 기업 톤입니다.',
    minus: 'B나 A보다 날카로움은 덜합니다.' },
];
document.getElementById('list').innerHTML = C.map(c => `<section class="card">
  <div class="hero"><p class="eyebrow">[ PHYSICAL AI — SENSING &amp; NOISE LAYER ]</p><h2 class="h">${c.h}</h2><p class="ko">${c.ko}</p>
    <div class="btns"><span class="btn p">기술 상담 요청 ${ARROW}</span><span class="btn g">Z·P·R 로드맵 ${ARROW}</span></div></div>
  <div class="meta"><div class="id">${c.id}${c.rec ? '<span>추천</span>' : ''}</div><div><b>WHY</b>${c.why}</div><div><b>PLUS</b>${c.plus}</div><div><b>MINUS</b>${c.minus}</div></div>
  <div class="meta" style="grid-template-columns:90px 1fr"><div class="id" style="font-size:12px">EN SUB</div><div>${c.en}</div></div>
</section>`).join('');
</script>
</body>
</html>
